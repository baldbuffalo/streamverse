name: Build StreamVerse Native Android TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.3

      - name: Setup Java 26
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/streamverse.jks \
            -alias streamverse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StreamVerse,O=StreamVerse,C=US" \
            -storepass streamverse123 \
            -keypass streamverse123

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: StreamVerse-AndroidTV-Native
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
