name: One-time - Generate Permanent Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore streamverse.jks \
            -alias streamverse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StreamVerse,O=StreamVerse,C=US" \
            -storepass streamverse123 \
            -keypass streamverse123

      - name: Print base64 (copy ALL of this into a new repo secret called RELEASE_KEYSTORE_BASE64)
        run: base64 -w 0 streamverse.jks; echo

      - name: Print SHA-1 (you'll register this with Firebase below)
        run: keytool -list -v -keystore streamverse.jks -alias streamverse -storepass streamverse123 | grep "SHA1:"
